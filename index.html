const BASE="https://yalli2.github.io/", GH="https://github.com/yalli2/";
const CATS=[["스페인어","--c-es"],["영어","--c-en"],["기타 외국어","--c-etc"],["교과 수업","--c-sub"],["HR 프로그램","--c-hr"],["입시·진로","--c-adm"],["다인에듀 운영","--c-dain"],["여행","--c-trip"],["검색 허브","--c-hub"],["강의·가이드","--c-gd"]];
const color=c=>`var(${(CATS.find(x=>x[0]===c)||[0,"--accent"])[1]})`;
let cat="전체";
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
function hl(text,terms){let h=esc(text);if(!terms.length)return h;
  const n=norm(text);const marks=[];
  terms.forEach(t=>{let i=0;while((i=n.indexOf(t,i))>-1){marks.push([i,i+t.length]);i+=t.length;}});
  if(!marks.length)return h;marks.sort((a,b)=>a[0]-b[0]);
  let out="",pos=0;for(const[a,b]of marks){if(a<pos)continue;out+=esc(text.slice(pos,a))+"<mark>"+esc(text.slice(a,b))+"</mark>";pos=b;}
  return out+esc(text.slice(pos));}
function stats(){
  const c=new Set(SITES.map(s=>s.cat)).size;
  const last=SITES.map(s=>s.updated).sort().pop();
  $("stats").innerHTML=`<div class="stat"><b>${SITES.length}</b><span>사이트</span></div><div class="stat"><b>${c}</b><span>분류</span></div><div class="stat"><b>${SITES.filter(s=>s.cat==="HR 프로그램").length}</b><span>HR 프로그램</span></div><div class="stat"><b>${last.slice(5).replace("-",".")}</b><span>최근 업데이트</span></div>`;}
function chips(){
  const all=[["전체","--ink"],...CATS];
  $("chips").innerHTML=all.map(([n,v])=>{const k=n==="전체"?SITES.length:SITES.filter(s=>s.cat===n).length;
    return `<button class="chip${cat===n?" on":""}" data-c="${n}"><i style="background:var(${v})"></i>${n} <small>${k}</small></button>`}).join("");
  $("chips").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{cat=b.dataset.c;try{localStorage.setItem("yc",cat)}catch(e){}chips();render();});}
function render(){
  const terms=norm($("q").value.trim()).split(/\s+/).filter(Boolean);
  let list=SITES.filter(s=>(cat==="전체"||s.cat===cat)&&terms.every(t=>norm([s.title,s.desc,s.repo,s.cat,s.tags.join(" ")].join(" ")).includes(t)));
  const so=$("sort").value;
  list.sort((a,b)=>so==="name"?a.title.localeCompare(b.title,"ko"):so==="created"?b.created.localeCompare(a.created):so==="oldest"?a.created.localeCompare(b.created):b.updated.localeCompare(a.updated)||a.repo.localeCompare(b.repo));
  $("count").textContent=`${list.length}개 사이트${cat!=="전체"?" · "+cat:""}${terms.length?" · ‘"+$("q").value.trim()+"’ 검색":""}`;
  $("grid").innerHTML=list.length?list.map(s=>`
   <article class="card" style="--cc:${color(s.cat)}">
     <div style="display:flex;justify-content:space-between"><span class="cat">${s.cat}</span><span class="date">${s.updated.replace(/-/g,".")}</span></div>
     <h3>${hl(s.title,terms)}</h3>
     <p>${hl(s.desc,terms)}</p>
     <div class="tags">${s.tags.map(t=>`<button class="tag" data-t="${esc(t)}">#${hl(t,terms)}</button>`).join("")}</div>
     <div class="foot"><span class="repo">${hl(s.repo,terms)}</span>
       <span class="links"><button class="copy" data-u="${BASE+s.repo}/" title="주소 복사">복사</button><a class="gh" href="${GH+s.repo}" target="_blank" rel="noopener">GitHub</a><a class="go" href="${BASE+s.repo}/" target="_blank" rel="noopener">열기 ↗</a></span></div>
   </article>`).join(""):`<div class="empty">검색 결과가 없습니다. 다른 단어로 찾아보세요.</div>`;
  $("grid").querySelectorAll(".tag").forEach(b=>b.onclick=()=>{$("q").value=b.dataset.t;render();window.scrollTo({top:0,behavior:"smooth"})});
  $("grid").querySelectorAll(".copy").forEach(b=>b.onclick=async()=>{try{await navigator.clipboard.writeText(b.dataset.u);b.textContent="복사됨";}catch(e){b.textContent="실패";}setTimeout(()=>b.textContent="복사",1400);});
}
try{const c=localStorage.getItem("yc");if(c&&(c==="전체"||CATS.some(x=>x[0]===c)))cat=c}catch(e){}
$("q").addEventListener("input",render);$("sort").addEventListener("change",render);
document.addEventListener("keydown",e=>{if(e.key==="/"&&document.activeElement!==$("q")){e.preventDefault();$("q").focus();}if(e.key==="Escape"){$("q").value="";render();}});
stats();chips();render();$("fc").textContent=`${SITES.map(s=>s.updated).sort().pop().replace(/-/g,".")} 기준 ${SITES.length}개`;
</script>
